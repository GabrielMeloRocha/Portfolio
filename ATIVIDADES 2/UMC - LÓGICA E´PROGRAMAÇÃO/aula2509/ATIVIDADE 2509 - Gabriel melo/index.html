    <script>

        let nota1 = parseFloat(prompt("Digite a Nota1:"))
        let nota2 = parseFloat(prompt("Digite a Nota2:"))
        let nota3 = parseFloat(prompt("Digite a Nota3:"))
        let nota4 = parseFloat(prompt("Digite a Nota4:"))

        let media = (nota1 + nota2 + nota3 + nota4) / 4

        if (media >= 5) {
            alert("Parabéns, vc foi aprovado!")
        } else if (media >= 3) {
            alert("Você ficou de Recuperação!")
        } else if (media > 0) {
            alert ("Você ficou de Exame!")
        } else {
            alert("Infelizmente você foi Reprovado sem direito a Exame!")
        }
    </script>
