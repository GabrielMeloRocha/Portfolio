<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — demonstração</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="cadastro-demo">
            <h1>Cadastro</h1>
            <br>
            <div class="input-box">
                <input id="nomeComp" placeholder="Nome Completo" type="text" autocomplete="name" disabled>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input id="user" placeholder="Login" type="email" autocomplete="email" disabled>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input id="novaSenha" placeholder="Senha" type="password" autocomplete="new-password" disabled>
                <i class="bx bx-lock"></i>
            </div>
            <div class="input-box">
                <input id="confSenha" placeholder="Confirme a Senha" type="password" autocomplete="new-password" disabled>
                <i class="bx bx-check"></i>
            </div>
            <p id="mensg">Demonstração visual. O cadastro real precisa do sistema Django hospedado.</p>
            <br>
            <button type="button" class="login" disabled>Cadastro indisponível nesta demonstração</button>
        </div>
    </div>
</body>
</html>
