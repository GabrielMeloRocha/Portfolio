{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form method="post">
            {% csrf_token %}

            <h1>Login</h1>

            <br>

            <div class="input-box">
                <input id="usuario" name="email" placeholder="E-mail" type="email" required autocomplete="email">
                <i class="bx bx-user"></i>
            </div>

            <div class="input-box">
                <input id="senha" name="senha" placeholder="Senha" type="password" required autocomplete="current-password">
                <i class="bx bx-lock"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="lembre_se">
                    Lembre-Se
                </label>
                <a href="{% url 'senha' %}">Esqueci minha senha</a>
            </div>

            {% if erro %}
                <p id="mensagem">{{ erro }}</p>
            {% else %}
                <p id="mensagem"></p>
            {% endif %}

            <br>

            <button type="submit" class="login">Login</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
            </div>
        </form>
    </div>

</body>
</html>
